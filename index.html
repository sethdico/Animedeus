<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animedeus</title>
    <style>
                :root {
            --primary-color: #FF9800;
            --secondary-color: #2C2C2C;
            --background-color: #121212;
            --text-color: #E0E0E0;
            --button-color: #3D3D3D;
            --button-hover-color: #FF9800;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        input {
            flex-grow: 1;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--button-color);
            border-radius: 5px;
        }
        button {
            background-color: var(--button-color);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--button-hover-color);
        }
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .search-result {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .search-result:hover {
            opacity: 0.7;
        }
        .search-result img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
        }
        .anime-details {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .error {
            color: #FF5252;
            text-align: center;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
        }
        .episode-navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <h1>Animedeus</h1>
        
        <div class="video-container">
            <iframe id="videoPlayer" allowfullscreen></iframe>
        </div>

        <div class="controls">
            <button id="prevEpisode">Previous</button>
            <button id="fallbackButton">Fallback: Off</button>
            <button id="nextEpisode">Next</button>
        </div>

        <div id="episodeNav" class="episode-nav"></div>
        <div id="episodeButtons" class="episode-buttons"></div>

        <input type="text" id="searchInput" placeholder="Search anime" autofocus>
        <button onclick="searchAnime()">Search</button>
        <div id="searchResults" class="search-results"></div>

        <div id="animeDetails" class="anime-details"></div>
        <div id="error" class="error"></div>
        <div id="loading" class="loading"></div>

        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </div>

    <script>
        // Base URLs
        const GOGOTAKU_BASE_URL = 'https://gogotaku.info';
        const JIKAN_BASE_URL = 'https://api.jikan.moe/v4';
        
        let currentEpisode = 1;
        let totalEpisodes = 0;
        let currentAnimeSlug = '';
        let isFallbackMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').focus();
        });

        const searchAnime = async () => {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) return;

            showLoading(true);
            clearError();

            try {
                // First try Jikan API for metadata
                const jikanResponse = await fetch(`${JIKAN_BASE_URL}/anime?q=${encodeURIComponent(searchTerm)}&limit=5`);
                const jikanData = await jikanResponse.json();

                // Then search on gogotaku
                const searchUrl = `${GOGOTAKU_BASE_URL}/search?keyword=${encodeURIComponent(searchTerm)}`;
                const response = await fetch(searchUrl);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Update selectors based on gogotaku's HTML structure
                const results = doc.querySelectorAll('.video-block');
                
                const combinedResults = Array.from(results).map(result => {
                    const title = result.querySelector('.name').textContent;
                    const slug = result.querySelector('a').href.split('/').pop();
                    const image = result.querySelector('img').src;
                    
                    // Find matching Jikan data
                    const jikanMatch = jikanData.data.find(anime => 
                        anime.title.toLowerCase() === title.toLowerCase()
                    );

                    return {
                        title,
                        slug,
                        image,
                        synopsis: jikanMatch?.synopsis || '',
                        rating: jikanMatch?.score || 'N/A',
                        year: jikanMatch?.year || 'N/A'
                    };
                });

                displaySearchResults(combinedResults);
            } catch (err) {
                showError('An error occurred while searching. Please try again.');
                console.error(err);
            } finally {
                showLoading(false);
            }
        };

        const displaySearchResults = (results) => {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';

            results.forEach(anime => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'search-result';
                resultDiv.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}" style="width: 50px; height: 70px; margin-right: 10px;">
                    <div>
                        <div style="font-weight: bold;">${anime.title}</div>
                        <div style="font-size: 0.8em;">Rating: ${anime.rating} | Year: ${anime.year}</div>
                        <div style="font-size: 0.8em; color: var(--text-color);">${anime.synopsis?.substring(0, 100)}...</div>
                    </div>
                `;
                resultDiv.onclick = () => loadAnime(anime.slug);
                searchResults.appendChild(resultDiv);
            });
        };

        const loadAnime = async (slug) => {
            currentAnimeSlug = slug;
            currentEpisode = 1;
            showLoading(true);
            clearError();

            try {
                const animeUrl = `${GOGOTAKU_BASE_URL}/anime/${slug}`;
                const response = await fetch(animeUrl);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Update selector based on gogotaku's HTML structure
                totalEpisodes = doc.querySelectorAll('.ep-item').length;
                updateEpisodeButtons();
                loadEpisode(currentEpisode);
            } catch (err) {
                showError('Failed to load anime. Please try again.');
                console.error(err);
            } finally {
                showLoading(false);
            }
        };

        const loadEpisode = (episode) => {
            if (!currentAnimeSlug) return;
            
            currentEpisode = episode;
            const watchUrl = `${GOGOTAKU_BASE_URL}/watch/${currentAnimeSlug}/episode-${episode}`;
            
            // Try to load the video player
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.src = watchUrl;

            // Add error handling for embedding restrictions
            videoPlayer.onerror = () => {
                if (!isFallbackMode) {
                    showError('Video embedding restricted. Try enabling fallback mode or visit the site directly.');
                } else {
                    // Fallback mode: open in new tab
                    window.open(watchUrl, '_blank');
                }
            };

            updateEpisodeButtons();
            updateAnimeDetails();
        };

        const changeEpisode = (delta) => {
            const newEpisode = currentEpisode + delta;
            if (newEpisode >= 1 && newEpisode <= totalEpisodes) {
                loadEpisode(newEpisode);
            }
        };

        const updateEpisodeButtons = () => {
            const container = document.getElementById('episodeButtons');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalEpisodes; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.classList.add('episode-button');
                if (i === currentEpisode) button.classList.add('current-episode');
                button.onclick = () => loadEpisode(i);
                container.appendChild(button);
            }
        };

        const updateAnimeDetails = async () => {
            const details = document.getElementById('animeDetails');
            
            try {
                // Try to fetch additional details from Jikan API
                const response = await fetch(`${JIKAN_BASE_URL}/anime?q=${encodeURIComponent(currentAnimeSlug)}&limit=1`);
                const data = await response.json();
                const animeInfo = data.data[0] || {};

                details.innerHTML = `
                    <h2>Now Playing</h2>
                    <p><strong>Anime:</strong> ${currentAnimeSlug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
                    <p><strong>Episode:</strong> ${currentEpisode} / ${totalEpisodes}</p>
                    ${animeInfo.synopsis ? `<p><strong>Synopsis:</strong> ${animeInfo.synopsis}</p>` : ''}
                    ${animeInfo.score ? `<p><strong>Rating:</strong> ${animeInfo.score}</p>` : ''}
                    ${animeInfo.year ? `<p><strong>Year:</strong> ${animeInfo.year}</p>` : ''}
                `;
            } catch (err) {
                details.innerHTML = `
                    <h2>Now Playing</h2>
                    <p><strong>Anime:</strong> ${currentAnimeSlug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
                    <p><strong>Episode:</strong> ${currentEpisode} / ${totalEpisodes}</p>
                `;
            }
        };

        const toggleFallback = () => {
            isFallbackMode = !isFallbackMode;
            const fallbackButton = document.getElementById('fallbackButton');
            fallbackButton.textContent = `Fallback: ${isFallbackMode ? 'On' : 'Off'}`;
            fallbackButton.classList.toggle('fallback-on', isFallbackMode);
            if (currentAnimeSlug) loadEpisode(currentEpisode);
        };

        const toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        };

        const showError = (message) => {
            document.getElementById('error').textContent = message;
        };

        const clearError = () => {
            document.getElementById('error').textContent = '';
        };

        const showLoading = (isLoading) => {
            document.getElementById('loading').textContent = isLoading ? 'Loading...' : '';
        };

        // Event Listeners
        document.getElementById('prevEpisode').addEventListener('click', () => changeEpisode(-1));
        document.getElementById('nextEpisode').addEventListener('click', () => changeEpisode(1));
        document.getElementById('fallbackButton').addEventListener('click', toggleFallback);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAnime();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animedeus</title>
    <style>
        :root {
            --primary-color: #FF9800;
            --secondary-color: #2C2C2C;
            --background-color: #121212;
            --text-color: #E0E0E0;
            --button-color: #3D3D3D;
            --button-hover-color: #FF9800;
            --dark-background-color: #121212;
            --dark-text-color: #E0E0E0;
            --light-background-color: #FFFFFF;
            --light-text-color: #000000;
        }
        body.dark-mode {
            --background-color: var(--dark-background-color);
            --text-color: var(--dark-text-color);
        }
        body.light-mode {
            --background-color: var(--light-background-color);
            --text-color: var(--light-text-color);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
            margin: 20px 0;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .episode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--button-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: var(--button-hover-color);
        }
        button:active {
            transform: scale(0.98);
        }
        .episode-button {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .current-episode {
            background-color: var(--primary-color);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--button-color);
            border-radius: 5px;
        }
        .search-results {
            background-color: var(--secondary-color);
            border-radius: 5px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .search-result {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-result:hover {
            background-color: var(--button-hover-color);
        }
        .search-result img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            margin-right: 10px;
        }
        .anime-details {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .error {
            color: #FF5252;
            text-align: center;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
        }
        .alternative-link {
            text-align: center;
            margin-top: 20px;
        }
        .alternative-link a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .alternative-link a:hover {
            text-decoration: underline;
        }
        .creator-info {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-color);
        }
        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: var(--button-color);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
        .theme-toggle:hover {
            background-color: var(--button-hover-color);
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .video-container {
                padding-top: 75%;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <h1>Animedeus</h1>
        
        <div class="video-container">
            <iframe id="videoPlayer" allowfullscreen></iframe>
        </div>

        <div class="controls">
            <button id="prevEpisode">Previous</button>
            <button id="fallbackButton">Fallback: Off</button>
            <button id="nextEpisode">Next</button>
        </div>

        <div id="episodeButtons" class="episode-buttons"></div>

        <input type="text" id="searchInput" placeholder="Search anime" autofocus>
        <button onclick="searchAnime()">Search</button>
        <div id="searchResults" class="search-results"></div>

        <div id="animeDetails" class="anime-details"></div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading"></div>

        <div class="alternative-link">
            <a href="https://kuroiru.co" target="_blank" rel="noopener noreferrer">If error, you can use this website: kuroiru.co</a>
        </div>
        <div class="creator-info">
            made by <a href="https://github.com/sethdico" target="_blank" rel="noopener noreferrer">sethdico</a> aka amadeus
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </div>

    <script>
        let currentEpisode = 1;
        let totalEpisodes = 0;
        let currentAnimeSlug = '';
        let isFallbackMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').focus();
        });

        const searchAnime = async () => {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) return;

            showLoading(true);
            clearError();

            try {
                const searchUrl = `https://gogotaku.info/search.html?keyword=${encodeURIComponent(searchTerm)}`;
                const response = await fetch(searchUrl);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const results = doc.querySelectorAll('.anime-card');
                
                displaySearchResults(Array.from(results).map(result => ({
                    title: result.querySelector('.anime-title').textContent,
                    slug: result.querySelector('a').href.split('/').pop(),
                    image: result.querySelector('img').src,
                    year: result.querySelector('.anime-year').textContent
                })));
            } catch (err) {
                showError('An error occurred while searching. Please try again.');
            } finally {
                showLoading(false);
            }
        };

        const displaySearchResults = (results) => {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';

            results.forEach(anime => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'search-result';
                resultDiv.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}" loading="lazy">
                    <div>
                        <div>${anime.title}</div>
                        <div style="font-size: 0.8em; color: #888;">${anime.year}</div>
                    </div>
                `;
                resultDiv.onclick = () => loadAnime(anime.slug);
                searchResults.appendChild(resultDiv);
            });
        };

        const loadAnime = async (slug) => {
            currentAnimeSlug = slug;
            currentEpisode = 1;
            showLoading(true);
            clearError();

            try {
                const animeUrl = `https://gogotaku.info/watch/${slug}`;
                const response = await fetch(animeUrl);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                const episodeList = doc.querySelectorAll('.episode-list li');
                totalEpisodes = episodeList.length || 12;
                
                updateEpisodeButtons();
                loadEpisode(currentEpisode);
            } catch (err) {
                showError('Failed to load anime. Please try again.');
            } finally {
                showLoading(false);
            }
        };

        const loadEpisode = (episode) => {
            if (!currentAnimeSlug) return;
            
            currentEpisode = episode;
            const watchUrl = `https://gogotaku.info/watch/${currentAnimeSlug}/episode-${episode}`;
            document.getElementById('videoPlayer').src = watchUrl;
            updateEpisodeButtons();
            updateAnimeDetails();
        };

        const changeEpisode = (delta) => {
            const newEpisode = currentEpisode + delta;
            if (newEpisode >= 1 && newEpisode <= totalEpisodes) {
                loadEpisode(newEpisode);
            }
        };

        const updateEpisodeButtons = () => {
            const container = document.getElementById('episodeButtons');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalEpisodes; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.classList.add('episode-button');
                if (i === currentEpisode) button.classList.add('current-episode');
                button.onclick = () => loadEpisode(i);
                container.appendChild(button);
            }
        };

        const updateAnimeDetails = () => {
            const details = document.getElementById('animeDetails');
            details.innerHTML = `
                <h2>Now Playing</h2>
                <p><strong>Anime:</strong> ${currentAnimeSlug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
                <p><strong>Episode:</strong> ${currentEpisode} / ${totalEpisodes}</p>
                <p><strong>Quality:</strong> HD</p>
            `;
        };

        const toggleFallback = () => {
            isFallbackMode = !isFallbackMode;
            const fallbackButton = document.getElementById('fallbackButton');
            fallbackButton.textContent = `Fallback: ${isFallbackMode ? 'On' : 'Off'}`;
            fallbackButton.classList.toggle('fallback-on', isFallbackMode);
            if (currentAnimeSlug) loadEpisode(currentEpisode);
        };

        const toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        };

        const showError = (message) => {
            document.getElementById('error').textContent = message;
        };

        const clearError = () => {
            document.getElementById('error').textContent = '';
        };

        const showLoading = (isLoading) => {
            document.getElementById('loading').textContent = isLoading ? 'Loading...' : '';
        };

        document.getElementById('prevEpisode').addEventListener('click', () => changeEpisode(-1));
        document.getElementById('nextEpisode').addEventListener('click', () => changeEpisode(1));
        document.getElementById('fallbackButton').addEventListener('click', toggleFallback);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAnime();
        });
    </script>
</body>
</html>

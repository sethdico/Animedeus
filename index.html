<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animedeus</title>
    <style>
        :root {
            --primary-color: #FF9800;
            --secondary-color: #2C2C2C;
            --background-color: #121212;
            --text-color: #E0E0E0;
            --button-color: #3D3D3D;
            --button-hover-color: #FF9800;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        input {
            flex-grow: 1;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--button-color);
            border-radius: 5px;
        }
        button {
            background-color: var(--button-color);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--button-hover-color);
        }
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .search-result {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .search-result:hover {
            opacity: 0.7;
        }
        .search-result img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
        }
        .anime-details {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .error {
            color: #FF5252;
            text-align: center;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
        }
        .episode-navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Animedeus</h1>
        
        <div class="video-container">
            <iframe id="videoPlayer" allowfullscreen></iframe>
        </div>

        <div class="episode-navigation">
            <button id="prevEpisode" disabled>Previous Episode</button>
            <button id="nextEpisode" disabled>Next Episode</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime..." />
            <button id="searchButton">Search</button>
        </div>

        <div id="searchResults" class="search-results"></div>
        <div id="animeDetails" class="anime-details"></div>
        <div id="error" class="error"></div>
        <div id="loading" class="loading"></div>
    </div>

    <script>
        const GOGOTAKU_BASE_URL = 'https://gogotaku.info';
        const JIKAN_BASE_URL = 'https://api.jikan.moe/v4';

        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const searchResults = document.getElementById('searchResults');
        const videoPlayer = document.getElementById('videoPlayer');
        const animeDetails = document.getElementById('animeDetails');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const prevEpisodeButton = document.getElementById('prevEpisode');
        const nextEpisodeButton = document.getElementById('nextEpisode');

        let currentAnime = null;
        let currentEpisode = 1;
        let totalEpisodes = 0;

        async function searchAnime(query) {
            try {
                const response = await fetch(`${GOGOTAKU_BASE_URL}/search.html?keyword=${encodeURIComponent(query)}`);
                const data = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(data, 'text/html');
                return Array.from(doc.querySelectorAll('.film-poster')).map(item => ({
                    title: item.querySelector('img').alt,
                    slug: item.querySelector('a').href.split('/').pop(),
                    image: item.querySelector('img').src,
                }));
            } catch (error) {
                console.error('Search error:', error);
                return [];
            }
        }

        async function getAnimeDetails(title) {
            try {
                const response = await fetch(`${JIKAN_BASE_URL}/anime?q=${encodeURIComponent(title)}&limit=1`);
                const data = await response.json();
                return data.data && data.data.length > 0 ? data.data[0] : null;
            } catch (error) {
                console.error('Jikan API error:', error);
                return null;
            }
        }

        function showLoading(isLoading) {
            loadingDiv.textContent = isLoading ? 'Loading...' : '';
        }

        function showError(message) {
            errorDiv.textContent = message;
        }

        function clearError() {
            errorDiv.textContent = '';
        }

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            showLoading(true);
            clearError();

            try {
                const results = await searchAnime(query);
                displaySearchResults(results);
            } catch (err) {
                showError('Failed to search anime');
            } finally {
                showLoading(false);
            }
        }

        function displaySearchResults(results) {
            searchResults.innerHTML = '';
            results.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = 'search-result';
                resultElement.innerHTML = `
                    <img src="${result.image}" alt="${result.title}" loading="lazy">
                    <p>${result.title}</p>
                `;
                resultElement.addEventListener('click', () => handleAnimeSelect(result));
                searchResults.appendChild(resultElement);
            });
        }

        async function handleAnimeSelect(anime) {
            currentAnime = anime;
            currentEpisode = 1;
            showLoading(true);
            clearError();

            try {
                const animePageResponse = await fetch(`${GOGOTAKU_BASE_URL}/watch/${anime.slug}`);
                const animePageHtml = await animePageResponse.text();
                const parser = new DOMParser();
                const animePageDoc = parser.parseFromString(animePageHtml, 'text/html');
                
                const episodeList = animePageDoc.querySelectorAll('.ep-item');
                totalEpisodes = episodeList.length;

                loadEpisode(currentEpisode);
                updateEpisodeButtons();

                const details = await getAnimeDetails(anime.title);
                displayAnimeDetails(details);
            } catch (err) {
                showError('Failed to load anime');
            } finally {
                showLoading(false);
            }
        }

        function loadEpisode(episodeNumber) {
            if (!currentAnime) return;
            currentEpisode = episodeNumber;
            const episodeUrl = `${GOGOTAKU_BASE_URL}/watch/${currentAnime.slug}/ep-${episodeNumber}`;
            videoPlayer.src = episodeUrl;
            updateEpisodeButtons();
        }

        function updateEpisodeButtons() {
            prevEpisodeButton.disabled = currentEpisode <= 1;
            nextEpisodeButton.disabled = currentEpisode >= totalEpisodes;
        }

        function displayAnimeDetails(details) {
            if (!details) {
                animeDetails.innerHTML = '<p>No details available</p>';
                return;
            }

            animeDetails.innerHTML = `
                <h2>${details.title}</h2>
                <p>${details.synopsis}</p>
                <div>
                    <strong>Score:</strong> ${details.score}
                    <strong>Episodes:</strong> ${details.episodes}
                    <strong>Status:</strong> ${details.status}
                    <strong>Aired:</strong> ${details.aired.string}
                </div>
                <div>
                    <strong>Genres:</strong> ${details.genres.map(genre => genre.name).join(', ')}
                </div>
            `;
        }

        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        prevEpisodeButton.addEventListener('click', () => {
            if (currentEpisode > 1) {
                loadEpisode(currentEpisode - 1);
            }
        });

        nextEpisodeButton.addEventListener('click', () => {
            if (currentEpisode < totalEpisodes) {
                loadEpisode(currentEpisode + 1);
            }
        });
    </script>
</body>
</html>
